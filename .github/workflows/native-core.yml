name: Portable native core

on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-core.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-core.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (arm64) failed to acquire a runner on 2026-10-28.
        # Keep hosted macOS coverage on Intel; ARM is also checked locally.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone native core
        run: cmake -S native -B work/native-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build work/native-build --config Release --parallel 2
      - name: Test without game files
        run: ctest --test-dir work/native-build -C Release --output-on-failure
